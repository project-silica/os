[package]
name = "silica-image"
description = "Builds the GPT disk image with a FAT32 ESP that QEMU boots (A03)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "silica-image"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# The kernel's own reader of the ramdisk archive: one validator for the
# host, the kernel and userspace.
silica-formats = { path = "../../kernel/formats" }
