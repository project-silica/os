name: Check
on:
  push:
  pull_request:
  merge_group:
  schedule:
    - cron: "17 3 * * *"
permissions:
  contents: read
jobs:
  check:
    if: github.event_name != 'schedule'
    uses: project-silica/.github/.github/workflows/pre-merge.yml@main
    with:
      repo: os
  nightly:
    if: github.event_name == 'schedule'
    uses: project-silica/.github/.github/workflows/nightly.yml@main
